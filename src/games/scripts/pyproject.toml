    "tensorboard>=2.21.0",
    "timm>=1.0.28",
    # "torch>=2",
    # "torchvision>=0.28.0",
    "transformers>=5.14.1",
    "typing-extensions>=4.15.0",
    "urllib3>=2.6.3",
    "wandb>=0.28.1",
    "webdataset>=1.0.2",
]

