    "pygame>=2.6.1",
    "python-box>=7.4.1",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "scikit-image>=0.25.2",
    "submitit>=1.5.4",
