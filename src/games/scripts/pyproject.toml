    "ffmpeg-python>=0.2.0",
    "fire>=0.7.1", 
    "flask>=3.1.3",
    "ftfy>=6.3.1",
    "future>=1.0.0",
    "gymnasium[accept-rom-license]>=1.2.3",
    "h5py>=3.16.0",
    "idna>=3.11",
    "iopath>=0.1.10",
    "jupyter>=1.1.1",
    "numpy>=2.2.6",
    "nvidia-cusparselt-cu12>=0.8.1",
    "opencv-python>=4.13.0.92",
